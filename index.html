<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="rocketId" />
    <title>rocketId</title>
    <meta name="description" content="Tu identidad outdoor: datos de emergencia, certificaciones y tu cordada." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rocketId" />
    <meta property="og:title" content="Agrégame a tu cordada en rocketId 🚀" />
    <meta property="og:description" content="Mira mi perfil, conocimientos y certificaciones outdoor." />
    <meta property="og:image" content="https://rocketid.vercel.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Aplica el tema antes de pintar para evitar el destello claro
      (function () {
        var pref = null
        try { pref = localStorage.getItem('rocketid-theme') } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#09090B')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
